[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flashcard"
version = "0.1.0"
description = "Flashcards saved over MCP during conversations, reviewed on a mobile web app"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "jinja2>=3.1.5,<4",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0,<3",
  "oracledb>=2.5,<4",
  "pydantic-settings>=2.6,<3",
  "mcp>=1.12,<2",
  "mobile-foundation",
]

[project.scripts]
flashcard = "flashcard.cli:main"

[tool.uv.sources]
mobile-foundation = { git = "https://github.com/devmrko/mobile-foundation.git", branch = "main" }

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/flashcard"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
