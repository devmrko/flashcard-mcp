# flashcard.cloud-handson.com — 중앙 nginx(.147) → 맥미니의 flashcard 앱(:8810). receipe conf와 같은 구조.
# 배치: /etc/nginx/conf.d/flashcard.cloud-handson.com.conf   (시크릿 없음)
# 인증: 웹은 앱 Basic Auth(FLASHCARD_WEB_AUTH), MCP는 URL 경로 토큰(/m/<token>/mcp). nginx는 TLS+프록시만.
# 네트워크: 라우터 192.168.0.208에 8810 → 맥미니(192.168.5.25):8810 포트포워딩 필요.
# TLS: 처음엔 80 블록만 두고 `sudo certbot certonly --webroot -w /var/www/html -d flashcard.cloud-handson.com` 후 443 블록 활성.
upstream flashcard_backend {
    server 192.168.0.208:8810;
    keepalive 8;
}
server {
    listen 80;
    listen [::]:80;
    server_name flashcard.cloud-handson.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name flashcard.cloud-handson.com;

    ssl_certificate     /etc/letsencrypt/live/flashcard.cloud-handson.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flashcard.cloud-handson.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 256k;

    # MCP 경로: 토큰이 URL에 있으므로 접근 로그에 남기지 않는다.
    location /m/ {
        access_log off;
        proxy_pass http://flashcard_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://flashcard_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
