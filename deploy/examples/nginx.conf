# nginx in front of flashcard on the same machine. Get a certificate first, e.g.
#   sudo certbot --nginx -d flashcard.example.com
# In .env: FLASHCARD_PUBLIC_HOST=flashcard.example.com (keep FLASHCARD_HOST=127.0.0.1).
server {
    listen 443 ssl http2;
    server_name flashcard.example.com;

    ssl_certificate     /etc/letsencrypt/live/flashcard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flashcard.example.com/privkey.pem;

    client_max_body_size 256k;

    location / {
        # MCP URLs (/m/<token>/mcp) contain the secret token: no access log.
        access_log off;
        proxy_pass http://127.0.0.1:8810;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
server {
    listen 80;
    server_name flashcard.example.com;
    return 301 https://$host$request_uri;
}
